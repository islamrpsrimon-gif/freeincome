<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#eef2f7;padding-bottom:120px}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px;box-shadow:0 4px 15px #0001}
.free{background:#fef3c7;color:#b45309;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:900;border:1px solid #fcd34d}
.badge{background:#e8f8f0;color:#0e9f6e;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:800}
.nav{position:fixed;bottom:10px;left:10px;right:10px;background:#fff;border-radius:999px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 8px 20px #0002;z-index:99}
.nav button{border:0;background:none;padding:8px 5px;border-radius:999px;font-size:10px;color:#666;font-weight:700}
.on{background:#0e9f6e!important;color:#fff!important}
.page{display:none}.show{display:block!important}
.tabs{display:flex;gap:6px;overflow:auto;margin-top:12px}.tabs::-webkit-scrollbar{display:none}
.t{border:1.5px solid #ddd;background:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.tOn{background:#0e9f6e!important;color:#fff!important;border-color:#0e9f6e!important}
.row{border:1px solid #eee;border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between}
.btn{background:#0e9f6e;color:#fff;border:0;border-radius:999px;padding:14px;width:100%;font-weight:900}
</style>
</head>
<body>

<div id="Home" class="page show">
<div style="background:#0e9f6e;padding:20px 20px 70px;border-radius:0 0 24px 24px;color:#fff;display:flex;justify-content:space-between">
<span>Free Income BD <span class="free">FREE</span></span><span>● ACTIVE</span>
</div>
<div class="card" style="margin:-50px 10px 10px;text-align:center;padding:24px">
<div style="font-size:10px;color:#888">BALANCE</div>
<div style="font-size:36px;font-weight:900">৳ <span id="bal">0</span></div>
<span class="badge">GigaPub Live</span> <span class="free">FREE EARN</span>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 10px">
<div class="card" style="margin:0;text-align:center"><b id="te">0</b><br><span style="font-size:10px">EARNED</span></div>
<div class="card" style="margin:0;text-align:center"><b>0/30</b><br><span style="font-size:10px">TASKS</span></div>
<div class="card" style="margin:0;text-align:center"><b id="uC1">0</b><br><span style="font-size:10px">USERS</span></div>
</div>
<div style="margin:10px"><button onclick="go('Earn')" class="btn">Start Earning →</button></div>
</div>

<div id="Earn" class="page"><div class="card" style="text-align:center"><b>Earn <span class="free">FREE</span></b><br><br><button onclick="add(10)" class="btn">Ad +10</button></div></div>
<div id="Tasks" class="page"><div class="card">Tasks <span class="free">FREE</span></div></div>
<div id="Refer" class="page"><div class="card" style="text-align:center">Refer Link<br><div id="refLink" style="font-size:11px;color:#0e9f6e;margin-top:8px;word-break:break-all"></div></div></div>
<div id="Withdraw" class="page"><div class="card"><b>Withdraw</b><br><br><input id="wNum" placeholder="Number" style="width:100%;padding:12px;border-radius:999px;border:0;background:#eee"><input id="wAmt" type="number" placeholder="100" style="width:100%;margin-top:8px;padding:12px;border-radius:999px;border:0;background:#eee"><button onclick="wd()" class="btn" style="margin-top:10px">Withdraw</button></div></div>
<div id="Profile" class="page"><div class="card" style="text-align:center">OWNER 👑<br><span id="bal2">0</span> Points <span class="free">FREE</span></div></div>

<div id="Admin" class="page">
<div class="card">
<b>Board Admin <span class="free">FREE DATABASE</span></b>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:10px">
<div style="background:#dcfce7;border-radius:12px;padding:10px;text-align:center"><b id="uC">0</b><br>Users</div>
<div style="background:#fef9c3;border-radius:12px;padding:10px;text-align:center"><b id="pC">0</b><br>Pending</div>
<div style="background:#dbeafe;border-radius:12px;padding:10px;text-align:center"><b id="tB">0</b><br>Total</div>
<div style="background:#fce7f3;border-radius:12px;padding:10px;text-align:center"><b>3</b><br>Refs</div>
</div>
<div class="tabs">
<button id="bUsers" onclick="atab('Users')" class="t tOn">👥 Users</button>
<button id="bTop" onclick="atab('Top')" class="t">🏆 Top</button>
<button id="bBalance" onclick="atab('Balance')" class="t">💰 Balance</button>
<button id="bWithdraw" onclick="atab('Withdraw')" class="t">💳 Withdraw</button>
<button id="bBroadcast" onclick="atab('Broadcast')" class="t">📢 Broadcast</button>
</div>
<div id="aBox" style="margin-top:12px"></div>
</div>
</div>

<div class="nav">
<button id="nHome" class="on" onclick="go('Home')">🏠<br>Home</button>
<button id="nEarn" onclick="go('Earn')">▶️<br>Earn</button>
<button id="nTasks" onclick="go('Tasks')">☑️<br>Tasks</button>
<button id="nRefer" onclick="go('Refer')">👥<br>Refer</button>
<button id="nWithdraw" onclick="go('Withdraw')">💳<br>Withdraw</button>
<button id="nProfile" onclick="go('Profile')">👤<br>Profile</button>
<button id="nAdmin" onclick="go('Admin')">🔐<br>Admin</button>
</div>

<script>
try{
const TOKEN="8684890686:AAEM8kQ_LLNXh_ofg3enFguKnPbK1FJgydA";
let tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); }

let bal = 0;
try{ bal = parseInt(localStorage.getItem('f_bal')||localStorage.getItem('fb_bal')||'22'); }catch(e){ bal=22; }
if(isNaN(bal)) bal=22;

let users=[];
try{
  let a = localStorage.getItem('f_users');
  let b = localStorage.getItem('fb_users');
  if(a){ users = JSON.parse(a); }
  if(users.length==0 && b){ users = JSON.parse(b); }
}catch(e){ users=[]; }
if(!Array.isArray(users) || users.length==0){ users=["5468979650"]; }

let wds=[];
try{ let w = localStorage.getItem('f_wds'); if(w) wds=JSON.parse(w); }catch(e){ wds=[]; }

let cur="Broadcast";

function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));
  let btn=document.getElementById('n'+id);
  if(btn) btn.classList.add('on');
  if(id=='Admin') atab(cur);
}
function refresh(){
  document.getElementById('bal').innerText=bal;
  document.getElementById('bal2').innerText=bal;
  document.getElementById('te').innerText=bal;
  document.getElementById('uC').innerText=users.length;
  document.getElementById('uC1').innerText=users.length;
  document.getElementById('pC').innerText=wds.length;
  document.getElementById('tB').innerText=bal*6;
  document.getElementById('refLink').innerText='https://t.me/FreeIncomeBD_bot?start=ref_'+users[0];
  localStorage.setItem('f_bal',bal);
  localStorage.setItem('f_users',JSON.stringify(users));
  localStorage.setItem('f_wds',JSON.stringify(wds));
}
window.add=(v)=>{ bal+=v; refresh(); alert('+'+v); }
window.wd=()=>{
  let num=document.getElementById('wNum').value;
  let amt=parseInt(document.getElementById('wAmt').value||'0');
  if(!num||amt<100) return alert('Min 100');
  if(amt>bal) return alert('Balance kom');
  wds.push({num,amt}); bal-=amt; refresh(); alert('Sent');
}
window.atab=(name)=>{
  cur=name;
  document.querySelectorAll('.t').forEach(x=>x.classList.remove('tOn'));
  document.getElementById('b'+name).classList.add('tOn');
  let box=document.getElementById('aBox');
  if(name=='Users'){
    let h=''; users.forEach(u=>{ h+=`<div class="row"><div><b>User paid</b><div style="font-size:12px">৳15 ${u}</div></div></div>`; });
    box.innerHTML=h;
  }else if(name=='Top'){
    box.innerHTML=`<div class="row">🏆 5468979650 - ${bal*6} ৳</div>`;
  }else if(name=='Balance'){
    box.innerHTML=`<div class="row" style="display:block"><input id="ab" type="number" placeholder="10" style="width:100%;padding:10px;border-radius:999px;border:1px solid #ddd"><button onclick="let v=parseInt(document.getElementById('ab').value||'0'); bal+=v; refresh(); alert('Added')" class="btn" style="margin-top:8px">Add</button></div>`;
  }else if(name=='Withdraw'){
    let h='<b>Withdraw</b><br><br>'; if(wds.length==0) h+='No Data'; wds.forEach(w=>{ h+=`<div class="row"><b>${w.amt}</b> ${w.num}</div>`; }); box.innerHTML=h;
  }else if(name=='Broadcast'){
    box.innerHTML=`<div style="background:#e8f8f0;padding:10px;border-radius:10px;font-size:12px;color:#0e9f6e">✅ ${users.length} জন মেম্বার আছে - FREE DATABASE</div><textarea id="msg" style="width:100%;border:2px solid #fbbf24;border-radius:12px;padding:12px;margin-top:10px;min-height:80px" placeholder="মেসেজ লিখো..."></textarea><button onclick="sendAll()" class="btn" style="margin-top:10px">📢 পাঠাও</button><div id="log" style="margin-top:8px;font-weight:800"></div>`;
  }
}
window.sendAll=async()=>{
  let m=document.getElementById('msg').value.trim();
  let log=document.getElementById('log');
  if(!m) return alert('মেসেজ লিখো');
  log.innerHTML=`⏳ ${users.length} জনকে...`;
  let ok=0;
  for(let chat_id of users){
    try{
      let r=await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id,text:`📢 Free Income BD\n\n${m}`})});
      let j=await r.json(); if(j.ok) ok++;
      log.innerHTML=`📤 ${ok}/${users.length}`;
      await new Promise(x=>setTimeout(x,300));
    }catch(e){}
  }
  log.innerHTML=`✅ ${ok} জনে গেছে!`;
}

refresh();
atab('Broadcast');

}catch(err){
  document.body.innerHTML='<div style="padding:20px;color:red">Error: '+err.message+'</div>';
}
</script>
</body>
</html>
