<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorp Cash Ultimate</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--green:#0e9f6e;--green-dark:#0a7a53;--light:#f2f5f7;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:var(--light);padding-bottom:110px}
.top-user{background:#fff;border-radius:28px;padding:12px 18px;margin:12px 16px;display:flex;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,0.06)}
.t-avatar{width:52px;height:52px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}
.header-green{background:linear-gradient(180deg,var(--green),var(--green-dark));border-radius:32px;margin:12px 16px;padding:22px 16px 60px 16px}
.balance-white{background:#fff;border-radius:32px;padding:28px;text-align:center;margin-top:20px}
.balance-amount{font-size:52px;font-weight:800}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border:none;width:calc(100% - 32px);margin:12px 16px;padding:18px;border-radius:20px;font-weight:700;font-size:16px}
.card-white{background:#fff;border-radius:28px;padding:20px;margin:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,0.05)}
.bottom-nav{position:fixed;bottom:16px;left:16px;right:16px;background:#fff;border-radius:32px;display:flex;justify-content:space-around;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,0.12)}
.nav-item{color:#94a3b8;font-size:11px;padding:12px 16px;border-radius:22px;cursor:pointer;text-align:center}
.nav-item.active{background:var(--green);color:#fff}
.page{display:none}.page.active{display:block}
</style>
</head>
