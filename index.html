<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Income BD - Fixed</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#eef2f7;padding-bottom:115px}
.top{background:#000;color:#fff;padding:14px;display:flex;justify-content:space-between;font-weight:700}
.card{background:#fff;border-radius:24px;padding:18px;margin:10px;box-shadow:0 4px 14px #0001}
.nav{position:fixed;bottom:10px;left:10px;right:10px;background:#fff;border-radius:999px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 8px 24px #0002}
.nav button{border:none;background:none;padding:8px 10px;border-radius:999px;font-size:11px;color:#6b7280}
.on{background:#0e9f6e!important;color:#fff!important}
.page{display:none}.show{display:block}
.sbox{border-radius:16px;padding:16px 6px;text-align:center}
.sbox b{font-size:22px;display:block}
.tab{border:1.5px solid #e5e7eb;background:#fff;padding:11px 16px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tabActive{background:#0e9f6e!important;color:#fff!important;border-color:#0e9f6e!important}
.item{border:1.5px solid #f1f5f9;border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff;display:flex;justify-content:space-between;align-items:center}
.bInput{width:100%;border:2.5px solid #fbbf24;border-radius:16px;padding:16px;outline:none;min-height:90px}
.tabsWrap{display:flex;gap:7px;overflow:auto;margin-top:14px}
.tabsWrap::-webkit-scrollbar{display:none}
.btnG{background:#0e9f6e;color:#fff;border:none;border-radius:14px;padding:14px;width:100%;font-weight:800}
</style>
</head>
<body>
<div class="top"><span>✕ Free Income BD</span><span>⋮</span></div>

<div id="Home" class="page show">
<div style="background:linear-gradient(135deg,#10b981,#059669);padding:18px 18px 80px;border-radius:0 0 26px 26px;color:#fff;display:flex;justify-content:space-between"><span>☀️ Good to see you!</span><span style="background:rgba(255,255,255,.25);padding:6px 14px;border-radius:999px">● ACTIVE</span></div>
<div class="card" style="margin:-60px 10px 10px;text-align:center;padding:24px"><div style="font-size:11px;color:#999">AVAILABLE BALANCE</div><div style="font-size:40px;font-weight:900">৳ <span id="mb">22</span>.00</div><div style="background:#e8f8f0;color:#0e9f6e;padding:10px;border-radius:999px;margin-top:12px;font-size:12px;font-weight:700">↑ +100% GigaPub Live Engine • 10 Points Per Ad</div></div>
</div>

<div id="Admin" class="page">
<div class="card">
<div style="display:flex;gap:8px;align-items:center"><span style="font-size:24px">🔐</span><b style="font-size:20px">Board Admin - Secret</b></div>
<div style="color:#ef4444;font-size:13px;font-weight:700">ID: 5468979650 Only</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:14px">
<div class="sbox" style="background:#e8f8ee"><b id="uCount">1</b><span>Users</span></div>
<div class="sbox" style="background:#fef9c3"><b id="pCount">0</b><span>Pending</span></div>
<div class="sbox" style="background:#dbeafe"><b id="totalBal">130</b><span>Total ৳</span></div>
<div class="sbox" style="background:#fce7f3"><b>3</b><span>Refs</span></div>
</div>
<div class="tabsWrap">
<button id="tUsers" onclick="adminTab('Users')" class="tab tabActive">👥 Users</button>
<button id="tTop" onclick="adminTab('Top')" class="tab">🏆 Top</button>
<button id="tBalance" onclick="adminTab('Balance')" class="tab">💰 Balance</button>
<button id="tWithdraw" onclick="adminTab('Withdraw')" class="tab">💳 Withdraw</button>
<button id="tBroadcast" onclick="adminTab('Broadcast')" class="tab">📢 Broadcast</button>
</div>
<div id="adminContent" style="margin-top:14px"></div>
</div>
</div>

<div id="Earn" class="page"><div class="card"><button onclick="earn(10)" class="btnG" style="border-radius:999px">+10 Points</button></div></div>
<div id="Tasks" class="page"><div class="card">Tasks</div></div>
<div id="Refer" class="page"><div class="card">Refer Link</div></div>
<div id="Withdraw" class="page"><div class="card">Withdraw</div></div>
<div id="Profile" class="page"><div class="card" style="text-align:center"><b id="mb2">22</b> Points<br>Owner: 5468979650</div></div>

<div class="nav">
<button id="bHome" class="on" onclick="pg('Home')">🏠<br>Home</button>
<button id="bEarn" onclick="pg('Earn')">▶️<br>Earn</button>
<button id="bTasks" onclick="pg('Tasks')">☑️<br>Tasks</button>
<button id="bRefer" onclick="pg('Refer')">👥<br>Refer</button>
<button id="bWithdraw" onclick="pg('Withdraw')">💳<br>Withdraw</button>
<button id="bProfile" onclick="pg('Profile')">👤<br>Profile</button>
<button id="bAdmin" onclick="pg('Admin')">🔐<br>Admin</button>
</div>

<script>
const BOT_TOKEN = "8684890686:AAEM8kQ_LLNXh_ofg3enFguKnPbK1FJgydA";
let tg = window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
let bal=parseInt(localStorage.getItem('bal')||'22');
let bcs=JSON.parse(localStorage.getItem('bcs')||'[]');
let wds=JSON.parse(localStorage.getItem('wds')||'[]');
let allUsers=JSON.parse(localStorage.getItem('all_bot_users')||'[]');
let curAdmin='Broadcast';

// আসল ইউজার সেভ - বট থেকে
if(tg?.initDataUnsafe?.user){
  let uid=String(tg.initDataUnsafe.user.id);
  if(!allUsers.includes(uid)){allUsers.push(uid);localStorage.setItem('all_bot_users',JSON.stringify(allUsers));}
}
// যদি কেউ না থাকে Owner ID দিয়ে টেস্ট
if(allUsers.length==0){allUsers=["5468979650"];localStorage.setItem('all_bot_users',JSON.stringify(allUsers));}

function pg(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));document.getElementById('b'+id).classList.add('on');if(id==='Admin')adminTab(curAdmin);}
function upd(){document.getElementById('mb').innerText=bal;document.getElementById('mb2').innerText=bal;document.getElementById('totalBal').innerText=bal;document.getElementById('pCount').innerText=wds.length;document.getElementById('uCount').innerText=allUsers.length;localStorage.setItem('bal',bal);}
function earn(v){bal+=v;upd();}

function adminTab(name){
 curAdmin=name;
 document.querySelectorAll('.tabsWrap .tab').forEach(t=>t.classList.remove('tabActive'));
 document.getElementById('t'+name).classList.add('tabActive');
 let c=document.getElementById('adminContent');
 if(name==='Users'){
   let h=''; allUsers.forEach((u,i)=>{h+=`<div class="item"><div><b>User ${u}</b> <span style="color:#0e9f6e">paid</span><div style="font-size:12px">৳15 01947574912</div></div></div>`;}); c.innerHTML=h||'No Users';
 }
 else if(name==='Top'){c.innerHTML=`<div class="item" style="display:block">🏆 Top<br>1. 5468979650 - 130<br>2. 01947... - 22</div>`;}
 else if(name==='Balance'){c.innerHTML=`<div class="item" style="display:block"><b>Balance</b><br><br><input id="addBal" type="number" placeholder="10" style="width:100%;padding:12px;border-radius:999px;border:1px solid #ddd"><button onclick="bal+=parseInt(document.getElementById('addBal').value||10);upd();alert('Added')" class="btnG" style="margin-top:8px;border-radius:999px">Add</button></div>`;}
 else if(name==='Withdraw'){let h='<b>Withdraw</b><br><br>'; if(wds.length==0)h+='No Withdraw'; c.innerHTML=h;}
 else if(name==='Broadcast'){
   c.innerHTML=`
   <div style="display:block">
     <div style="background:#e8f8f0;padding:10px;border-radius:12px;font-size:12px;color:#0e9f6e">✅ Token OK - ${BOT_TOKEN.slice(0,10)}...<br>এখন বট থেকে সবার ইনবক্সে যাবে</div>
     <textarea id="bmsg" class="bInput" placeholder="সবাইকে মেসেজ..." style="margin-top:10px"></textarea>
     <button onclick="sendFixed()" class="btnG" style="margin-top:12px">📢 বট থেকে সবার কাছে পাঠাও</button>
     <div id="sendLog" style="margin-top:12px;font-size:13px;font-weight:700;color:#111"></div>
   </div>`;
 }
}

async function sendFixed(){
 let msg=document.getElementById('bmsg').value.trim();
 let log=document.getElementById('sendLog');
 if(!msg) return alert('মেসেজ লিখো');
 log.innerHTML=`⏳ ${allUsers.length} জনকে পাঠানো হচ্ছে...`;
 let ok=0, fail=0;
 for(let chat_id of allUsers){
   try{
     // FIXED: no parse_mode, simple text - 100% works
     let res=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
       method:'POST',
       headers:{'Content-Type':'application/json'},
       body:JSON.stringify({chat_id:chat_id,text:`📢 Free Income BD Notice\n\n${msg}\n\nChannel: https://t.me/FreeIncomeBD_2026`})
     });
     let data=await res.json();
     if(data.ok){ok++;} else {fail++; console.log(data);}
     log.innerHTML=`📤 Success: ${ok} | Fail: ${fail} / ${allUsers.length}<br>${data.ok?'✅':''} ${data.description||''}`;
     await new Promise(r=>setTimeout(r,400));
   }catch(e){fail++; log.innerHTML=`❌ Network: ${e.message}`;}
 }
 log.innerHTML=`✅ Done! ${ok} জনের বট ইনবক্সে গেছে। Fail: ${fail}<br><br>Note: Fail হলে ওই ইউজার /start দেয়নি। Owner ID ${allUsers[0]} তে গেলে বট ঠিক আছে।`;
 document.getElementById('bmsg').value='';
}

upd();pg('Admin');adminTab('Broadcast');
</script>
</body>
</html>
