<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#0b071a;color:#fff;font-family:'Outfit',sans-serif;padding-bottom:120px}
.header{margin:12px;border:1px solid #facc1580;background:linear-gradient(90deg,#1a102e,#2a1d4a);border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.profile-card{margin:16px;background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(168,85,247,0.15));border:1px solid #a855f7aa;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:0 0 25px #a855f740}
.profile-card img{width:64px;height:64px;border-radius:50%;border:2px solid #facc15;object-fit:cover}
.level-badge{background:#2a1d4a;border:1px solid #facc15;color:#facc15;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.btn-gold{background:linear-gradient(90deg,#c084fc,#facc15);border:none;padding:8px 16px;border-radius:12px;font-weight:700;color:#000;box-shadow:0 0 12px #facc15a0;cursor:pointer}
.mission{margin:12px 16px;background:rgba(255,255,255,0.05);border:1px solid #ffffff1a;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.wheel{width:180px;height:180px;margin:12px auto;border-radius:50%;background:conic-gradient(#facc15 0 45deg,#1a102e 45deg 90deg,#a855f7 90deg 135deg,#1a102e 135deg 180deg,#facc15 180deg 225deg,#1a102e 225deg 270deg,#a855f7 270deg 315deg,#1a102e 315deg 360deg);border:4px solid #facc15;display:flex;align-items:center;justify-content:center;transition:transform 3s ease}
.wheel::after{content:'👑';background:#0b071a;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #facc15;font-size:28px}
.bottom-nav{position:fixed;bottom:12px;left:12px;right:12px;background:linear-gradient(90deg,#1a102e,#2a1d4a);border:1px solid #a855f766;border-radius:20px;display:flex;justify-content:space-around;padding:12px 0;z-index:99}
.nav-item{opacity:.5;text-align:center;cursor:pointer;font-size:11px} .nav-item.active{opacity:1;color:#facc15}
.page{display:none} .page.active{display:block}
input,select{width:100%;padding:12px;border-radius:12px;margin:6px 0;background:#120c25;color:#fff;border:1px solid #a855f755}
.leader-card{margin:8px 16px;background:linear-gradient(90deg,#1e1438,#251c4a);border:1px solid #ffffff15;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px}
</style>
</head>
<body>

<div class="profile-card">
  <img id="uPhoto" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
  <div style="flex:1">
    <div id="uName" style="font-weight:700">Loading...</div>
    <div class="level-badge" id="uLevel">LEVEL 1 ✨</div>

  </div>

</div>

<div id="page-home" class="page active">
  <div class="mission"><div><b>Daily Check-in</b><div style="font-size:12px;color:#aaa">+10 Coins</div></div><button id="checkinBtn" onclick="dailyCheckin()" class="btn-gold">Claim</button></div>
  <div style="text-align:center;margin:18px"><b>⭐ Bonus Wheel</b><div class="wheel" id="wheel"></div><button onclick="spinWheel()" class="btn-gold" style="width:90%;padding:14px;margin-top:10px;background:linear-gradient(90deg,#a855f7,#6d28d9);color:#fff">SPIN NOW</button></div>
  <div style="margin:16px"><b>🏆 Leaderboard Top 3</b></div><div id="topList"></div>
</div>

<div id="page-games" class="page"><div class="mission"><div><b>Watch Ad +20</b></div><button onclick="showAd()" class="btn-gold">Watch</button></div></div>

<div id="page-earn" class="page">
  <div class="profile-card"><div style="width:100%;text-align:center"><b>Invite & Earn</b><div id="inviteLink" style="background:#0b071a;padding:10px;border-radius:10px;font-size:11px;margin-top:8px;word-break:break-all;border:1px solid #a855f7">Loading...</div><button onclick="copyInvite()" class="btn-gold" style="width:100%;margin-top:10px">Copy Link</button></div></div>
</div>

<div id="page-wallet" class="page">
  <div class="mission" style="flex-direction:column;align-items:stretch"><h3 style="margin:0">💼 Wallet</h3><select id="payMethod"><option>bKash</option><option>Nagad</option></select><input id="payNumber" placeholder="Number"><input id="payAmount" type="number" placeholder="Min 1000"><button onclick="requestWithdraw()" class="btn-gold" style="width:100%;padding:12px;margin-top:6px">Request Withdraw</button><div id="myWithdraws" style="margin-top:10px"></div></div>
  <div style="margin:12px 16px;background:#1a102e;border:2px solid #facc15;border-radius:16px;padding:14px"><b style="color:#facc15">👑 ADMIN PAYMENT PANEL</b><div id="adminWithdrawList" style="margin-top:10px">Loading...</div></div>
</div>

<div id="page-profile" class="page">
  <div class="mission" style="justify-content:center;text-align:center;flex-direction:column">
    <img id="uPhoto2" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:90px;height:90px;border-radius:50%;border:3px solid #facc15;object-fit:cover">
    <div id="uName2" style="margin-top:10px;font-weight:700;font-size:18px">Player</div>
    <div style="color:#aaa;font-size:12px">ID: <span id="uIdShow"></span></div>
    <div style="margin-top:12px;color:#facc15">You are Owner ✅</div>
    <div id="totalMembers" style="margin-top:14px;background:#1a102e;border:1px solid #facc15;border-radius:12px;padding:12px;width:100%;font-weight:700;font-size:15px">👥 Total Members: Loading...</div>
    <div style="margin-top:10px;background:#0b071a;border-radius:10px;padding:10px;width:100%"><small style="color:#aaa">Your Coins</small><div style="font-size:22px;color:#facc15;font-weight:700"><span id="myPoints2">0</span> 🪙</div></div>
  </div>
</div>

<div class="bottom-nav">
  <div id="nav-home" class="nav-item active" onclick="switchTab('home')">🏠<br>Home</div>
  <div id="nav-games" class="nav-item" onclick="switchTab('games')">🎮<br>Games</div>
  <div id="nav-earn" class="nav-item" onclick="switchTab('earn')">🎁<br>Earn</div>
  <div id="nav-wallet" class="nav-item" onclick="switchTab('wallet')">💼<br>Wallet</div>
  <div id="nav-profile" class="nav-item" onclick="switchTab('profile')">👤<br>Profile</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, query, orderBy, limit, increment, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAod-YPFImwNkxyLxT41y8PrRnZe3vb10", authDomain: "freeincome-5a9bb.firebaseapp.com", projectId: "freeincome-5a9bb", storageBucket: "freeincome-5a9bb.firebasestorage.app", messagingSenderId: "100906100907", appId: "1:100906100907:web:40a433acf0d5dc5e0374e" };
const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);
let userId=null;
window.switchTab=(tab)=>{ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById('page-'+tab).classList.add('active'); document.getElementById('nav-'+tab).classList.add('active'); if(tab==='wallet') loadAdminWithdraws(); if(tab==='profile') loadTotalMembers(); };
function initTelegram(){ let tgUser=null; try{ if(window.Telegram?.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); tgUser=Telegram.WebApp.initDataUnsafe?.user; } }catch(e){} if(tgUser){ userId=String(tgUser.id); document.getElementById('uName').innerText=tgUser.first_name; document.getElementById('uName2').innerText=tgUser.first_name; document.getElementById('uIdShow').innerText=userId; if(tgUser.photo_url){ document.getElementById('uPhoto').src=tgUser.photo_url; document.getElementById('uPhoto2').src=tgUser.photo_url; } } else { userId="test_123"; document.getElementById('uName').innerText="FREE INCOME | OWNER 👑"; document.getElementById('uName2').innerText="FREE INCOME | OWNER"; document.getElementById('uIdShow').innerText="5468970950"; } document.getElementById('inviteLink').innerText="https://t.me/freeincomebd14bot/app?startapp="+userId; initUser(); }
async function initUser(){ const ref=doc(db,"users",userId); try{ const snap=await getDoc(ref); const photo=document.getElementById('uPhoto').src; if(!snap.exists()){ await setDoc(ref,{name:document.getElementById('uName').innerText,photo:photo,points:469,createdAt:serverTimestamp()}); document.getElementById('myPoints').innerText=469; document.getElementById('myPoints2').innerText=469; } else{ const d=snap.data(); document.getElementById('myPoints').innerText=d.points||0; document.getElementById('myPoints2').innerText=d.points||0; document.getElementById('uLevel').innerText="LEVEL "+Math.floor((d.points||0)/100+1)+" ✨"; if(d.photo && d.photo.startsWith('http')){ document.getElementById('uPhoto').src=d.photo; document.getElementById('uPhoto2').src=d.photo; } // update photo if telegram has new
 try{ await updateDoc(ref,{photo:photo, name:document.getElementById('uName').innerText}); }catch(e){} 
 if(d.lastCheckin){ const last=d.lastCheckin.toDate(); const now=new Date(); if(last.getDate()===now.getDate()&&last.getMonth()===now.getMonth()&&last.getFullYear()===now.getFullYear()){ document.getElementById('checkinBtn').innerText="Done ✅"; document.getElementById('checkinBtn').disabled=true; } } } }catch(e){ document.getElementById('myPoints').innerText=469; document.getElementById('myPoints2').innerText=469; } loadTop(); loadMyWithdraws(); loadAdminWithdraws(); loadTotalMembers(); }
async function loadTop(){ try{ const q=query(collection(db,"users"),orderBy("points","desc"),limit(3)); const snap=await getDocs(q); let html=""; let rank=1; const icons=["👑","🥈","🥉"]; snap.forEach(d=>{ const u=d.data(); const pic = u.photo && u.photo.startsWith('http') ? u.photo : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'; html+=`<div class="leader-card"><div>${icons[rank-1]}</div><img src="${pic}" style="width:40px;height:40px;border-radius:50%;border:1px solid #facc15;object-fit:cover"><div style="flex:1"><b>#${rank} ${u.name||'Player'}</b><div style="font-size:12px;color:#facc15">${u.points||0} Pts</div></div><div style="color:#22c55e;font-size:12px">▲ +${Math.floor((u.points||0)/10)}</div></div>`; rank++; }); document.getElementById('topList').innerHTML=html||"<div style='text-align:center;color:#aaa'>No users yet</div>"; }catch(e){} }
async function loadTotalMembers(){ try{ const snap=await getDocs(collection(db,"users")); document.getElementById('totalMembers').innerHTML=`👥 Total Members: ${snap.size} জন`; }catch(e){ document.getElementById('totalMembers').innerHTML=`👥 Total Members: --`; } }
window.dailyCheckin=async()=>{ const ref=doc(db,"users",userId); try{ const snap=await getDoc(ref); const data=snap.data(); if(data.lastCheckin){ const last=data.lastCheckin.toDate(); const now=new Date(); if(last.getDate()===now.getDate()&&last.getMonth()===now.getMonth()&&last.getFullYear()===now.getFullYear()) return alert("❌ আজকের জন্য হয়ে গেছে!"); } await updateDoc(ref,{points:increment(10),lastCheckin:serverTimestamp()}); const s=await getDoc(ref); document.getElementById('myPoints').innerText=s.data().points; document.getElementById('myPoints2').innerText=s.data().points; document.getElementById('checkinBtn').innerText="Done ✅"; alert("✅ +10 Added!"); loadTop(); }catch(e){ alert("Done"); } };
window.copyInvite=()=>{ navigator.clipboard.writeText(document.getElementById('inviteLink').innerText); alert("Copied!"); };
window.requestWithdraw=async()=>{ const method=document.getElementById('payMethod').value; const number=document.getElementById('payNumber').value; const amount=parseInt(document.getElementById('payAmount').value); if(!number||!amount) return alert("Number & Amount দিন"); if(amount<1000) return alert("Min 1000"); const myPts=parseInt(document.getElementById('myPoints').innerText); if(amount>myPts) return alert("Point নেই"); await addDoc(collection(db,"withdrawals"),{userId,userName:document.getElementById('uName').innerText,method,number,amount,status:"pending",createdAt:serverTimestamp()}); await updateDoc(doc(db,"users",userId),{points:increment(-amount)}); alert("✅ Request Sent!"); location.reload(); };
async function loadMyWithdraws(){ try{ const q=query(collection(db,"withdrawals"),where("userId","==",userId),orderBy("createdAt","desc"),limit(5)); const snap=await getDocs(q); let h=""; snap.forEach(d=>{ const w=d.data(); h+=`<div style="background:#0b071a;padding:8px;border-radius:8px;margin:4px 0;font-size:12px">${w.amount} pts - ${w.method} - <b>${w.status}</b></div>`; }); document.getElementById('myWithdraws').innerHTML=h; }catch(e){} }
window.loadAdminWithdraws=async()=>{ try{ const q=query(collection(db,"withdrawals"),orderBy("createdAt","desc"),limit(30)); const snap=await getDocs(q); let html=""; snap.forEach(d=>{ const w=d.data(); html+=`<div style="background:#0b071a;padding:10px;border-radius:10px;margin:6px 0"><b>${w.userName}</b> - ${w.amount}<br><small>${w.method}:${w.number} - ${w.status}</small><br><button onclick="approveWithdraw('${d.id}')" class="btn-gold" style="padding:5px 10px;margin-top:5px">Paid</button> <button onclick="rejectWithdraw('${d.id}','${w.userId}',${w.amount})" class="btn-gold" style="background:#ef4444;padding:5px 10px">Reject</button></div>`; }); document.getElementById('adminWithdrawList').innerHTML=html||"No requests"; }catch(e){} };
window.approveWithdraw=async(id)=>{ await updateDoc(doc(db,"withdrawals",id),{status:"paid"}); alert("Paid"); loadAdminWithdraws(); };
window.rejectWithdraw=async(id,uid,amt)=>{ await updateDoc(doc(db,"withdrawals",id),{status:"rejected"}); await updateDoc(doc(db,"users",uid),{points:increment(amt)}); alert("Refunded"); loadAdminWithdraws(); };
window.addPointsAfterAd=async(amt)=>{ try{ await updateDoc(doc(db,"users",userId),{points:increment(amt)}); }catch(e){} };
initTelegram();
</script>
<script>
const AdController=window.Adsgram.init({blockId:"52029"});
function showAd(){ AdController.show().then(res=>{ if(res.done){ if(window.addPointsAfterAd) window.addPointsAfterAd(20); alert("🎉 +20 Coins!"); location.reload(); } }).catch(()=>alert("No ad")); }
function spinWheel(){ const w=document.getElementById('wheel'); w.style.transform="rotate("+(360*5+Math.random()*360)+"deg)"; setTimeout(()=>{ showAd(); },3000); }
</script>
</body>
</html>
