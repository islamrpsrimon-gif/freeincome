<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREE INCOME BD</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif;padding-bottom:90px}
.top-bar{padding:14px;background:#121212;position:sticky;top:0;display:flex;justify-content:space-between}
.card{background:#1e1e2f;margin:10px 16px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.rank{color:#888}
.me{border:1.5px solid #00d4ff}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.pending{color:#ff9800;background:#ff980033;border:1px solid #ff9800}
.paid{color:#00e676;background:#00e67633;border:1px solid #00e676}
.btn{width:100%;padding:12px;background:#00d4ff;border:none;border-radius:10px;font-weight:bold;margin-top:10px}
input{width:100%;padding:12px;margin-top:10px;background:#1e1e2f;border:1px solid #333;border-radius:10px;color:#fff}
.nav{position:fixed;bottom:0;width:100%;background:#121212;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #222}
.nav div{font-size:10px;text-align:center;color:#777}
.nav div.active{color:#00d4ff}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar"><b>🏆 Top Earners</b><span style="color:#00e676">● LIVE</span></div>
<div id="topList"></div>

<div id="payoutSec" style="margin:16px">
<h3>Withdraw</h3>
<p>Balance: <span id="bal">0</span> PTS</p>
<input id="num" placeholder="bKash / Nagad">
<input id="amt" type="number" placeholder="Min 500">
<button class="btn" onclick="reqW()">Withdraw</button>
<div id="myList" style="margin-top:20px"></div>

<div id="adminBox" style="margin-top:30px;border-top:1px solid #333;padding-top:15px">
<h3 style="color:#ff5252">Admin - Pending</h3>
<div id="adminW"></div>
<h3 style="color:#ff9800;margin-top:20px">🚨 উল্টো করলে Alert (SMS)</h3>
<div id="alerts"></div>
</div>
</div>

<div class="nav">
<div>🏠<br>HOME</div><div>📋<br>TASKS</div><div class="active">🏆<br>TOP</div><div>💳<br>PAYOUT</div><div>👤<br>YOU</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,query,orderBy,limit,getDocs,doc,getDoc,setDoc,addDoc,where,onSnapshot,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAo4-YPFeNvhKxyLxtA1yw8PRnAze3vbI0",
  authDomain: "freeincome-5a9bb.firebaseapp.com",
  projectId: "freeincome-5a9bb",
  storageBucket: "freeincome-5a9bb.firebasestorage.app",
  messagingSenderId: "1009061909707",
  appId: "1:1009061909707:web:40a4d33acf0d5dc5e0374e"
};
const ADMIN_ID="5468979650";
const db=getFirestore(initializeApp(firebaseConfig));
let userId=localStorage.getItem("uid")||ADMIN_ID;
let userName="User";
localStorage.setItem("uid",userId);

// 1. REAL TOP 10 - নকল বাদ
async function loadTop(){
  let q=query(collection(db,"users"),orderBy("points","desc"),limit(10));
  let snap=await getDocs(q);
  let h="";let i=1;
  snap.forEach(d=>{
    let u=d.data();
    h+=`<div class="card ${d.id==userId?'me':''}"><span><span class="rank">#${i}</span> ${u.name||'User'}</span><b>${u.points} PTS</b></div>`;i++;
  });
  document.getElementById("topList").innerHTML=h||"<div class='card'>কেউ জয়েন করেনি এখনো</div>";
}
loadTop();

// Balance load
let uref=doc(db,"users",userId);
let us=(await getDoc(uref)).data();
if(us) document.getElementById("bal").innerText=us.points;

// 2. Withdraw + Pending/Paid + SMS Alert
window.reqW=async()=>{
  let num=document.getElementById("num").value;
  let amt=parseInt(document.getElementById("amt").value);
  if(!num||!amt) return alert("Number & Amount দাও");
  let u=(await getDoc(uref)).data();
  if(amt>u.points){
    // উল্টো করলে SMS Alert
    await addDoc(collection(db,"admin_alerts"),{message:`🚨 উল্টো: ${userId} ${amt} তুলতে চায়, আছে ${u.points} | Num:${num}`,time:serverTimestamp()});
    return alert("Balance কম!");
  }
  await addDoc(collection(db,"withdrawals"),{userId,number:num,amount:amt,status:"pending",time:serverTimestamp()});
  await addDoc(collection(db,"admin_alerts"),{message:`💸 নতুন Pending: ${userId} - ${amt} PTS - ${num}`,time:serverTimestamp()});
  alert("Pending এ গেছে, Admin দেখবে");
}

// My history Pending/Paid
onSnapshot(query(collection(db,"withdrawals"),where("userId","==",userId),orderBy("time","desc")),s=>{
  let h="";s.forEach(d=>{let w=d.data();h+=`<div class="card"><span>${w.amount} PTS - ${w.number}</span><span class="badge ${w.status}">${w.status.toUpperCase()}</span></div>`});
  document.getElementById("myList").innerHTML=h;
});

// Admin দেখবে Pending + Paid করতে পারবে + Alert দেখবে
if(userId==ADMIN_ID){
  onSnapshot(query(collection(db,"withdrawals"),where("status","==","pending"),orderBy("time","desc")),s=>{
    let h="";s.forEach(d=>{let w=d.data();h+=`<div class="card"><div>${w.userId}<br>${w.amount} PTS - ${w.number}</div><button onclick="paid('${d.id}')" style="padding:6px 10px;background:#00e676;border:none;border-radius:8px">PAID</button></div>`});
    document.getElementById("adminW").innerHTML=h;
  });
  onSnapshot(query(collection(db,"admin_alerts"),orderBy("time","desc"),limit(20)),s=>{
    let h="";s.forEach(d=>{h+=`<div class="card" style="font-size:12px">${d.data().message}</div>`});
    document.getElementById("alerts").innerHTML=h;
  });
}
window.paid=async(id)=>{await updateDoc(doc(db,"withdrawals",id),{status:"paid"});}
</script>
</body>
</html>
