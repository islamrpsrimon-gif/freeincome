<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Free Income BD</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:'Hind Siliguri',sans-serif;padding-bottom:90px}
.card-white{background:#fff;border-radius:18px;padding:16px;margin:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:#0088cc;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.btn-red{background:#ff3b30}.btn-green{background:#00c851}
.page{display:none}.page.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee;z-index:99}
.bottom-nav button{background:none;border:none;font-size:12px;color:#666}.bottom-nav button.active{color:#0088cc;font-weight:bold}
.header{background:linear-gradient(135deg,#1356cc,#0088cc,#00c6ff);color:#fff;padding:20px;border-radius:0 0 24px 24px;text-align:center}
.stat{display:flex;justify-content:space-between;margin-top:10px}
.stat div{background:rgba(255,255,255,.2);padding:8px 14px;border-radius:10px}
textarea,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<h2>💰 Free Income BD</h2>
<p id="userName">Loading...</p>
<div class="stat"><div>Balance: $<span id="myBalance">0.00</span></div><div>Refer: <span id="myRefer">0</span></div></div>
<p id="notice" style="margin-top:10px;background:#fff;color:#0088cc;padding:6px 10px;border-radius:20px;font-size:13px;display:none"></p>
</div>
<div id="page-home" class="page active">
<div class="card-white"><h3>📺 Daily Task</h3><p>Ad দেখে ইনকাম করো</p><button class="btn" onclick="watchAd()">🎬 Ad দেখো + $0.01</button><p style="margin-top:10px">Total Ads: <span id="totalAds">0</span></p></div>
<div class="card-white"><h3>🔗 Refer & Earn</h3><p>প্রতি Refer এ $0.10</p><input id="refLink" readonly><button class="btn" onclick="copyRef()">Copy Link</button></div>
</div>
<div id="page-withdraw" class="page">
<div class="card-white"><h3>💸 Withdraw</h3><p>Min Withdraw: $50 - 2 Refer লাগবে</p><input id="wNumber" placeholder="Bkash/Nagad Number"><input id="wAmount" type="number" placeholder="Amount"><button class="btn btn-green" onclick="requestWithdraw()">Withdraw Request</button></div>
</div>
<div id="page-admin" class="page">
<div class="card-white"><h3>👑 Admin Panel</h3><div style="display:flex;gap:6px;overflow:auto"><button onclick="adminTab('users')">Users</button><button onclick="adminTab('top')">Top</button><button onclick="adminTab('balance')">Balance</button><button onclick="adminTab('withdraw')">Withdraw</button><button onclick="adminTab('broadcast')">Broadcast</button></div></div>
<div id="adminTab-users" class="card-white">Loading Users...</div>
<div id="adminTab-top" class="card-white" style="display:none"></div>
<div id="adminTab-balance" class="card-white" style="display:none"></div>
<div id="adminTab-withdraw" class="card-white" style="display:none"></div>
<div id="adminTab-broadcast" class="card-white" style="display:none">
<h3>📢 Broadcast</h3>
<textarea id="broadcastText" rows="4" placeholder="মেসেজ লিখো, ভিডিও লিংক সহ দিলে সবার কাছে যাবে..."></textarea>
<button id="bBtn" class="btn" onclick="sendBroadcast()">📢 সবাইকে পাঠাও</button>
<button id="dBtn" class="btn btn-red" onclick="deleteLastBroadcast()" style="margin-top:8px">🗑️ সবার থেকে ডিলিট করো</button>
<p id="bStatus" style="margin-top:8px;font-weight:bold"></p>
</div>
</div>
<div class="bottom-nav">
<button class="active" onclick="switchPage('home')">🏠 Home</button>
<button onclick="switchPage('withdraw')">💸 Withdraw</button>
<button id="nav-admin" onclick="switchPage('admin')" style="display:none">👑 Admin</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAod-YPFHMwqyXLyT4I7BPrfnZe3vb10",
  authDomain: "freeincome-5a9bb.firebaseapp.com",
  projectId: "freeincome-5a9bb",
  storageBucket: "freeincome-5a9bb.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123:web:abc"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CONFIG = {
  BOT_LINK: "https://t.me/FreeIncomeBD_bot?start=ref_",
  MIN_WITHDRAW: 50,
  MIN_REFER: 2,
  ADMIN_IDS: ["5468979650"],
  BOT_TOKEN: "8684880686:AAEM8kQ_LLNxh_of3enFguKnPbkJFJgyda",
  MONETAG_ZONE: "REPLACE",
  GIGAPUB_ID: "REPLACE"
};

let userId = null;
let userData = null;

window.switchPage=(p)=>{
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(p==='admin') loadAdmin();
}
window.adminTab=(tab)=>{
  ['users','top','balance','withdraw','broadcast'].forEach(t=>{
    const e=document.getElementById('adminTab-'+t);
    if(e) e.style.display=(t===tab?'block':'none');
  });
}
window.copyRef=()=>{
  const i=document.getElementById('refLink'); i.select(); document.execCommand('copy'); alert("Copied!");
}
window.watchAd=async()=>{
  if(!userId) return;
  const ref=doc(db,"users",userId);
  await updateDoc(ref,{balance:increment(0.01),totalAds:increment(1),totalEarned:increment(0.01)});
  alert("Ad Watched +$0.01"); location.reload();
}
window.requestWithdraw=async()=>{
  const num=document.getElementById('wNumber').value.trim();
  const amt=parseFloat(document.getElementById('wAmount').value);
  if(!num || !amt){alert("Number & Amount দাও");return;}
  if(amt<CONFIG.MIN_WITHDRAW){alert(`Min ${CONFIG.MIN_WITHDRAW} লাগবে`);return;}
  if((userData.referrals||0)<CONFIG.MIN_REFER){alert(`${CONFIG.MIN_REFER} Refer লাগবে`);return;}
  if((userData.balance||0)<amt){alert("Balance কম");return;}
  await addDoc(collection(db,"withdraws"),{userId,number:num,amount:amt,status:"pending",time:Date.now(),name:userData.name||""});
  await updateDoc(doc(db,"users",userId),{balance:increment(-amt)});
  alert("Request Sent"); location.reload();
}
window.sendBroadcast=async()=>{
  const txt=document.getElementById('broadcastText').value.trim();
  if(!txt){alert("মেসেজ লিখো");return;}
  const btn=document.getElementById('bBtn'); const status=document.getElementById('bStatus');
  if(btn){btn.disabled=true; btn.innerText="পাঠানো হচ্ছে...";}
  try{ await setDoc(doc(db,"config","notice"),{text:txt,time:Date.now()}); }catch(e){}
  const uSnap=await getDocs(collection(db,"users"));
  let savedMsgs=[]; let count=0;
  for(const d of uSnap.docs){
    try{
      const res=await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({chat_id:d.id,text:`📢 Free Income BD থেকে নোটিশ:\n\n${txt}`,parse_mode:"HTML"})
      });
      const data=await res.json();
      if(data.ok){ savedMsgs.push({chat_id:d.id,message_id:data.result.message_id}); count++; }
      if(status) status.innerText=`পাঠানো হচ্ছে ${count}/${uSnap.size}...`;
      await new Promise(r=>setTimeout(r,80));
    }catch(e){}
  }
  await setDoc(doc(db,"config","lastBroadcast"),{messages:savedMsgs,time:Date.now()});
  if(status) status.innerText=`✅ ${count} জনের কাছে গেছে!`;
  alert(`${count} জন পেয়েছে`); if(btn){btn.disabled=false; btn.innerText="📢 সবাইকে পাঠাও";}
}
window.deleteLastBroadcast=async()=>{
  if(!confirm("শেষ মেসেজটা সবার থেকে ডিলিট করবে?")) return;
  const dBtn=document.getElementById('dBtn'); if(dBtn){dBtn.disabled=true; dBtn.innerText="ডিলিট হচ্ছে...";}
  const lastDoc=await getDoc(doc(db,"config","lastBroadcast"));
  if(!lastDoc.exists()){alert("কোনো মেসেজ পাইনি"); if(dBtn) dBtn.disabled=false; return;}
  const msgs=lastDoc.data().messages||[]; let del=0;
  for(const m of msgs){
    try{
      await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/deleteMessage`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({chat_id:m.chat_id,message_id:m.message_id})
      }); del++;
    }catch(e){}
  }
  alert(`${del} জনের থেকে ডিলিট হয়েছে!`); if(dBtn){dBtn.disabled=false; dBtn.innerText="🗑️ সবার থেকে ডিলিট করো";}
}
async function loadAdmin(){
  const uSnap=await getDocs(collection(db,"users"));
  let users=[]; uSnap.forEach(d=>users.push({id:d.id,...d.data()}));
  document.getElementById('adminTab-users').innerHTML=`Total Users: ${uSnap.size}<br>`+users.map(u=>`${u.id} - ${u.name||''}`).join('<br>');
  document.getElementById('adminTab-top').innerHTML=users.sort((a,b)=>(b.referrals||0)-(a.referrals||0)).slice(0,20).map(u=>`${u.id} - Ref:${u.referrals||0}`).join('<br>');
  document.getElementById('adminTab-balance').innerHTML=users.sort((a,b)=>(b.balance||0)-(a.balance||0)).map(u=>`${u.id} - $${u.balance||0}`).join('<br>');
  const wSnap=await getDocs(collection(db,"withdraws"));
  let h=""; wSnap.forEach(d=>{const w=d.data(); h+=`${w.userId} - $${w.amount} - ${w.status}<br>`}); 
  document.getElementById('adminTab-withdraw').innerHTML=h||"No withdraw";
}
async function init(){
  try{
    if(window.Telegram?.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); const u=Telegram.WebApp.initDataUnsafe?.user; if(u){userId=String(u.id); document.getElementById('userName').innerText=u.first_name||"User";} }
  }catch(e){}
  if(!userId) userId="5468979650";
  const ref=doc(db,"users",userId);
  let snap=await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{name:document.getElementById('userName').innerText||"User",balance:0.10,totalAds:0,totalEarned:0,referrals:0,joined:Date.now()});
    snap=await getDoc(ref);
  }
  userData=snap.data();
  document.getElementById('myBalance').innerText=(userData.balance||0).toFixed(2);
  document.getElementById('myRefer').innerText=userData.referrals||0;
  document.getElementById('totalAds').innerText=userData.totalAds||0;
  document.getElementById('refLink').value=CONFIG.BOT_LINK+userId;
  // FIXED PART - এই জায়গাটাই আগে ভাঙা ছিল
  try{
    const n=await getDoc(doc(db,"config","notice"));
    if(n.exists()){
      const el=document.getElementById('notice');
      el.innerText=n.data().text;
      el.style.display='block';
    }
  }catch(e){}
  if(CONFIG.ADMIN_IDS.includes(userId)){ document.getElementById('nav-admin').style.display='block'; }
}
init();
</script>
</body>
</html>
